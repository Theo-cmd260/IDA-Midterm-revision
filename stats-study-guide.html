<script>
// ---------------------------------------------------------------------
// CONTENT DATA

const SECTIONS = [
  { id: "s2", label: "Descriptive Stats", number: "Session 2", title: "Descriptive Statistics: Numerical Measures",
    blurb: "How to describe a data set with a handful of numbers: where its centre is, how spread out it is, what shape it has, and how it moves with another variable.",
    topics: [
      {
        title: "Statistic vs. Parameter",
        hot: false,
        breakdown: [
          "A number calculated from a <b>sample</b> is a <b>sample statistic</b> (e.g. sample mean, $\\bar{x}$).",
          "A number calculated from an entire <b>population</b> is a <b>population parameter</b> (e.g. population mean, $\\mu$).",
          "A sample statistic is used as the <b>point estimator</b> of the matching population parameter — your best single guess at the real, usually-unknowable population value."
        ],
        analogy: "Think of a pot of soup. Tasting one spoonful is your <i>sample statistic</i> — it estimates the flavour of the whole pot (the <i>population parameter</i>), which you'd only know for certain if you drank it all.",
        terms: ["sample statistic", "population parameter", "point estimator"]
      },
      {
        title: "Measures of Location: Mean, Median, Mode, Weighted Mean",
        hot: true,
        hotReason: "Foundational — appears in nearly every stats paper, often as a full worked question by hand.",
        breakdown: [
          "<b>Mean</b> ($\\bar{x}$ for a sample, $\\mu$ for a population): the arithmetic average — sum of all values divided by how many there are. Most-used, but pulled around by extreme values.",
          "<b>Median</b>: the middle value once data is sorted. Odd count → the exact middle. Even count → average of the two middle values. Preferred when data has extreme values (e.g. income, property prices).",
          "<b>Mode</b>: the most frequently occurring value. Two modes = <b>bimodal</b>; more than two = <b>multimodal</b>.",
          "<b>Weighted mean</b>: each value is multiplied by a weight reflecting its importance (e.g. credit hours in a GPA) before averaging — <i>not</i> every value counts equally."
        ],
        formula: "\\bar{x} = \\dfrac{\\sum x_i}{n} \\qquad \\mu = \\dfrac{\\sum x_i}{N} \\qquad \\bar{x}_w = \\dfrac{\\sum w_i x_i}{\\sum w_i}",
        analogy: "Mean, median and mode are three different ways to describe the 'typical' person at a party. <b>Mean</b> = pool everyone's cash and split it evenly. <b>Median</b> = line everyone up by wealth and pick the middle person. <b>Mode</b> = whichever amount of cash the most people happen to be carrying.",
        example: "Monthly starting salaries (n=12): mean = 5,940; median = 5,905 (average of 6th &amp; 7th sorted values); mode = 5,880 (the only value repeated).",
        terms: ["mean", "median", "mode", "weighted mean", "bimodal", "multimodal"]
      },
      {
        title: "Measures of Variability: Range, Variance, SD, CV",
        hot: true,
        hotReason: "Nearly always tested together as one multi-part question (range → variance → SD → CV from the same data set).",
        breakdown: [
          "<b>Range</b> = largest value − smallest value. Simple, but only uses two data points, so it's very sensitive to outliers.",
          "<b>Variance</b> = the average of the squared deviations from the mean. Uses every value in the data set. Population divides by $N$; a <i>sample</i> divides by $n-1$ (not $n$) so it isn't biased when estimating the population variance.",
          "<b>Standard deviation</b> = the positive square root of the variance. Its big advantage over variance: it's back in the <i>original units</i> of the data, so it's easier to interpret.",
          "<b>Coefficient of variation (CV)</b> = standard deviation relative to the mean, expressed as a percentage. Lets you compare spread across data sets that use different units or have very different means."
        ],
        formula: "s^2 = \\dfrac{\\sum (x_i-\\bar{x})^2}{n-1} \\qquad s=\\sqrt{s^2} \\qquad CV = \\left(\\dfrac{s}{\\bar{x}}\\right)\\times 100\\%",
        analogy: "Standard deviation is like measuring how far students in a class sit from the average seat — a small SD means everyone's clustered near the middle rows; a large SD means seats are scattered from the front row to the back wall.",
        example: "Starting salary data: variance ≈ 27,440.91; standard deviation ≈ 165.65; so CV ≈ (165.65/5,940) × 100% ≈ 2.8% — the spread is small relative to the average salary.",
        terms: ["range", "variance", "standard deviation", "coefficient of variation"]
      },
      {
        title: "Distribution Shape: Skewness",
        hot: true,
        hotReason: "A classic 'identify and explain' exam question — comparing mean vs. median position tells you the skew direction.",
        breakdown: [
          "<b>Symmetric</b> distribution: skewness = 0; mean = median = mode; bell-shaped/normal.",
          "<b>Negatively skewed (left-skewed)</b>: a long tail to the <i>left</i> caused by a few unusually <i>small</i> values; mean is usually <i>less than</i> the median.",
          "<b>Positively skewed (right-skewed)</b>: a long tail to the <i>right</i> caused by a few unusually <i>large</i> values; mean is usually <i>more than</i> the median.",
          "Rule of thumb for Pearson's coefficient of skewness: values beyond ±1 signal excessive skewness driven by a few extreme outliers."
        ],
        analogy: "Picture a tug-of-war between the data values. The mean is the flag in the middle of the rope — it always gets dragged toward whichever side has the extreme outliers. The median holds its ground, since it only cares about rank order, not magnitude.",
        terms: ["skewness", "symmetric distribution", "negatively skewed", "positively skewed"]
      },
      {
        title: "Association Between Two Variables: Covariance & Correlation",
        hot: true,
        hotReason: "Frequently paired with a small x–y table and asked as a full calculation.",
        breakdown: [
          "<b>Covariance</b> measures the <i>direction</i> of a linear relationship: positive = variables move together; negative = they move oppositely. Its size isn't standardised, so it's hard to compare across different pairs of variables.",
          "<b>Correlation coefficient (r)</b> is covariance standardised to always fall between −1 and +1, so it tells you both <i>direction</i> and <i>strength</i>.",
          "r near +1 → strong positive relationship; r near −1 → strong negative relationship; r near 0 → weak or no linear relationship.",
          "Correlation is <i>not</i> causation — two variables can move together without one causing the other."
        ],
        formula: "s_{xy} = \\dfrac{\\sum (x_i-\\bar{x})(y_i-\\bar{y})}{n-1} \\qquad r_{xy} = \\dfrac{s_{xy}}{s_x s_y}",
        analogy: "Covariance is like whispering — you can tell whether the message is 'yes' or 'no' (direction), but the volume depends on the room (the units), so you can't compare loudness across rooms. Correlation is the same message spoken at a fixed, standard volume every time — now you can fairly compare strength across any pair of variables.",
        example: "San Francisco Electronics store: more weekend commercials aired ↔ higher next-week sales. Sample covariance = 11, sample correlation ≈ 0.93 — a strong positive relationship.",
        terms: ["covariance", "correlation coefficient"]
      }
    ]
  },

  { id: "s3", label: "Probability Basics", number: "Session 3", title: "Introduction to Probability",
    blurb: "The vocabulary and rules for quantifying uncertainty — from a single event's likelihood to how two events interact.",
    topics: [
      {
        title: "Experiments, Sample Space & Events",
        hot: false,
        breakdown: [
          "An <b>experiment</b> is any process that generates well-defined outcomes (rolling a die, surveying a customer).",
          "The <b>sample space (S)</b> is the set of <i>all</i> possible outcomes; each individual outcome is a <b>sample point</b>.",
          "An <b>event</b> is any collection of one or more outcomes from the sample space (a subset of S).",
          "<b>Simple event</b>: exactly one outcome (rolling a 4). <b>Compound event</b>: two or more outcomes (rolling an even number). <b>Certain event</b>: guaranteed to happen (P=1). <b>Impossible event</b>: can never happen (P=0)."
        ],
        analogy: "The sample space is the full menu at a restaurant. An event is any subset of dishes you'd be happy to be served — maybe just one dish (simple event), or 'anything vegetarian' (compound event).",
        terms: ["experiment", "sample space", "sample point", "event", "simple event", "compound event"]
      },
      {
        title: "Types & Methods of Assigning Probability",
        hot: false,
        breakdown: [
          "<b>Subjective probability</b>: based on judgement, experience or intuition — can't be statistically verified.",
          "<b>Objective probability</b>: can be verified through data; derived <i>a priori</i> (known in advance, e.g. dice), <i>empirically</i> (observed through data collection), or <i>mathematically</i> (via theoretical formulas — the topic of Sessions 4 &amp; 5).",
          "Two basic rules any valid probability assignment must satisfy: every outcome's probability is between 0 and 1 inclusive, and all outcome probabilities for an experiment must sum to exactly 1.",
          "<b>Classical method</b>: equally likely outcomes, $P = 1/n$. <b>Relative frequency method</b>: probability = observed frequency ÷ total observations. <b>Subjective method</b>: a reasoned personal estimate."
        ],
        formula: "P(A)=\\dfrac{r}{n}\\quad\\text{(classical/relative frequency, where }r\\text{ = favourable outcomes, }n\\text{ = total outcomes)}",
        analogy: "Classical method is knowing a coin is fair before you ever flip it. Relative frequency is figuring out a coin might be biased only after flipping it 100 times and counting. Subjective is your gut feeling before either of those exists — like a manager's 'gut sense' that a new product will sell.",
        terms: ["subjective probability", "objective probability", "classical method", "relative frequency method", "subjective method"]
      },
      {
        title: "Properties & the Complement Rule",
        hot: false,
        breakdown: [
          "Every probability lies between 0 and 1 inclusive.",
          "P(impossible event) = 0; P(certain event) = 1.",
          "The probabilities of all outcomes in a collectively exhaustive set sum to 1.",
          "<b>Complement</b>: the probability that an event does <i>not</i> happen is $P(A^c)=1-P(A)$."
        ],
        formula: "P(A^c) = 1 - P(A)",
        analogy: "If there's a 7% chance a manufactured part is defective, the complement rule instantly tells you there's a 93% chance it's fine — you never had to separately measure the 'fine' outcomes.",
        terms: ["complement"]
      },
      {
        title: "Union, Intersection, Mutually Exclusive & Collectively Exhaustive",
        hot: true,
        hotReason: "The building blocks for every addition-law and Venn-diagram-style question.",
        breakdown: [
          "<b>Union</b> ($A \\cup B$): outcomes in A, or B, or both. Keyword: <i>'or'</i>.",
          "<b>Intersection</b> ($A \\cap B$): outcomes in both A and B simultaneously. Keyword: <i>'and'</i>.",
          "<b>Mutually exclusive</b>: A and B share no outcomes — if one happens, the other cannot; $P(A \\cap B)=0$.",
          "<b>Collectively exhaustive</b>: the union of all the events covers the entire sample space — at least one of them is guaranteed to occur."
        ],
        analogy: "Union is 'raise your hand if you like tea OR coffee' (some hands go up for both). Intersection is 'stay seated only if you like tea AND coffee' — a smaller, overlapping group.",
        terms: ["union", "intersection", "mutually exclusive", "collectively exhaustive"]
      },
      {
        title: "Addition Law",
        hot: true,
        hotReason: "One of the most consistently examined formulas — usually via a contingency table (e.g. company size × sector).",
        breakdown: [
          "Used to find the probability of A, or B, or both occurring — i.e. the union.",
          "For events that are <i>not</i> mutually exclusive, you must subtract the overlap once so it isn't double-counted.",
          "For <i>mutually exclusive</i> events, there's no overlap to subtract — simply add the two probabilities."
        ],
        formula: "P(A \\cup B) = P(A) + P(B) - P(A \\cap B) \\qquad \\text{(mutually exclusive: } P(A \\cup B)=P(A)+P(B)\\text{)}",
        analogy: "Counting people who like tea OR coffee: if you just add 'tea-drinkers' + 'coffee-drinkers', anyone who likes both gets counted twice. Subtracting the 'likes both' group once fixes the double count.",

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function renderTopicCard(t) {
  const card = el("div", "card");
  const head = el("div", "card-head");
  head.appendChild(el("h3", "", t.title));
  if (t.hot) {
    const badge = el("span", "hot-badge", "☆ Exam favourite");
    badge.title = t.hotReason || "";
    head.appendChild(badge);
  }
  card.appendChild(head);

  if (t.breakdown && t.breakdown.length) {
    const ul = el("ul", "breakdown");
    t.breakdown.forEach(b => ul.appendChild(el("li", "", b)));
    card.appendChild(ul);
  }

  if (t.formula) {
    const fb = el("div", "formula-box");
    fb.appendChild(el("div", "flabel", "FORMULA"));
    fb.appendChild(el("div", "", "$$" + t.formula + "$$"));
    card.appendChild(fb);
  }

  if (t.analogy) {
    const a = el("div", "analogy");
    a.appendChild(el("span", "alabel", "ANALOGY"));
    a.appendChild(document.createTextNode(""));
    a.innerHTML += t.analogy;
    card.appendChild(a);
  }

  if (t.example) {
    const ex = el("div", "example");
    ex.appendChild(el("span", "elabel", "WORKED EXAMPLE FROM THE SLIDES"));
    ex.innerHTML += t.example;
    card.appendChild(ex);
  }

  if (t.note) {
    const gn = el("div", "gap-note");
    gn.innerHTML = "<b>Note:</b> " + t.note;
    card.appendChild(gn);
  }

  if (t.terms && t.terms.length) {
    const tc = el("div", "terms");
    t.terms.forEach(term => tc.appendChild(el("span", "term-chip", term)));
    card.appendChild(tc);
  }

  return card;
}

function renderSectionPanel(sec) {
  const panel = el("section", "panel");
  panel.id = "panel-" + sec.id;

  const head = el("div", "panel-head");
  head.appendChild(el("div", "eyebrow", sec.number));
  head.appendChild(el("h2", "", sec.title));
  head.appendChild(el("p", "", sec.blurb));
  panel.appendChild(head);

  sec.topics.forEach(t => panel.appendChild(renderTopicCard(t)));
  return panel;
}

  const ul = el("ul");
  [
    "Each topic card has a plain-language <b>breakdown</b>, the exact <b>formula</b> where relevant, a memory-anchor <b>analogy</b>, and a worked example pulled from your own slides.",
    "A <b>☆ Exam favourite</b> badge marks topics with repeated worked examples in the slides or strong overlap with typical business-statistics exam patterns — hover the badge for why.",
    "Two topics are flagged as <b>content gaps</b> (Poisson distribution; Uniform &amp; Exponential distributions) — named in the learning objectives but not actually developed in the slides you uploaded.",
    "Check the <b>Exam Focus</b> tab for a consolidated, ranked list, and the <b>Glossary</b> tab to search every key term in one place."
  ].forEach(s => ul.appendChild(el("li", "", s)));
  howto.appendChild(ul);
  panel.appendChild(howto);

  return panel;
}

function renderGlossary() {
  const panel = el("section", "panel");
  panel.id = "panel-glossary";
  const head = el("div", "panel-head");
  head.appendChild(el("div", "eyebrow", "REFERENCE"));
  head.appendChild(el("h2", "", "Glossary of Key Terms"));
  head.appendChild(el("p", "", "Every bolded term across all five sessions, in one searchable list."));
  panel.appendChild(head);

  const input = el("input", "glossary-search");
  input.type = "text";
  input.placeholder = "Search terms…";
  panel.appendChild(input);

  const grid = el("div", "glossary-grid");
  GLOSSARY.forEach(([term, def, sess]) => {
    const g = el("div", "gterm");
    g.dataset.search = (term + " " + def).toLowerCase();
    g.appendChild(el("div", "gt-term", term));
    g.appendChild(el("div", "gt-def", def));
    g.appendChild(el("span", "gt-session", sess));
    grid.appendChild(g);
  });
  panel.appendChild(grid);

  input.addEventListener("input", () => {
    const q = input.value.toLowerCase();
    grid.querySelectorAll(".gterm").forEach(g => {
      g.style.display = g.dataset.search.includes(q) ? "" : "none";
    });
  });

  return panel;
}

function renderExamFocus() {
  const panel = el("section", "panel");
  panel.id = "panel-examfocus";
  const head = el("div", "panel-head");
  head.appendChild(el("div", "eyebrow", "EXAM PREP"));
  head.appendChild(el("h2", "", "Likely Hot Topics"));
  head.appendChild(el("p", "", "A ranked shortlist of what's most worth prioritising."));
  panel.appendChild(head);

  const caveat = el("div", "caveat");
  caveat.innerHTML = "<b>Honesty check:</b> I could not find verified, publicly available Botswana Accountancy College past papers or examiner reports for this specific course — none turned up in a search, and I won't guess at specific past questions I can't confirm. What follows instead is a reasoned shortlist based on two real signals: (1) which topics your own slides devote the most repeated worked examples to — lecturers tend to drill what they intend to examine — and (2) which topics recur across comparable Southern African business-statistics exam papers I could verify (University of Botswana, NUST, and similar). Treat this as a prioritisation guide, not a leak of actual exam content — always confirm against your lecturer's own past papers or study guide if you have access to them.";
  panel.appendChild(caveat);

  EXAM_FOCUS.forEach(f => {
    const item = el("div", "focus-item");
    item.appendChild(el("span", "sess", f.sess));
    item.appendChild(el("h3", "", f.title));
    item.appendChild(el("div", "why", f.why));
    panel.appendChild(item);
  });

  return panel;
}

// ---------------------------------------------------------------------
// TAB WIRING
// ---------------------------------------------------------------------

const TAB_DEFS = [
  { id: "overview", label: "Overview" },
  ...SECTIONS.map(s => ({ id: s.id, label: s.label })),
  { id: "glossary", label: "Glossary" },
  { id: "examfocus", label: "Exam Focus" }
];

const tabsNav = document.getElementById("tabs");
const mainEl = document.getElementById("main");

TAB_DEFS.forEach(t => {
  const btn = document.createElement("button");
  btn.textContent = t.label;
  btn.dataset.tab = t.id;
  btn.addEventListener("click", () => switchTab(t.id));
  tabsNav.appendChild(btn);
});

mainEl.appendChild(renderOverview());
SECTIONS.forEach(sec => mainEl.appendChild(renderSectionPanel(sec)));
mainEl.appendChild(renderGlossary());
mainEl.appendChild(renderExamFocus());

function switchTab(id) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel-" + id).classList.add("active");
  document.querySelectorAll("nav.tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === id);
  });
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([document.getElementById("panel-" + id)]);
  }
}

switchTab("overview");
</script>
